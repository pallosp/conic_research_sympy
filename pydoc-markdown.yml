loaders:
  - type: python
    search_path: [src/lib]
    # Explicit order; scripts/check_docs_freshness.py verifies it's complete.
    modules:
      # Foundations
      - type_aliases
      - math
      - matrix
      # Points, lines, polygons
      - point
      - line
      - polygon
      - triangle
      # Conics
      - conic
      - conic_classes
      - degenerate_conic
      - conic_direction
      - central_conic
      - circle
      - ellipse
      - hyperbola
      - parabola
      - polar_conic
      # Relations between objects
      - distance
      - incidence
      - intersection
      # Transformations
      - transform
      - transform_classes

processors:
  - type: filter
    skip_empty_modules: true
    # Hide the unevaluated forms of matrix valued functions, such as PivotColumn.
    expression: "default() and 'MatrixFunction' not in getattr(obj, 'bases', [])"

renderer:
  type: markdown
  filename: docs/api.md

  render_toc: true
  toc_maxdepth: 1

  source_linker:
    type: git
    url_template: ../{path}#L{lineno}
  source_format: ([source]({url}))

  add_method_class_prefix: true
  descriptive_class_title: false
